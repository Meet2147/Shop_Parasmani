# Render Blueprint for the ParasmaniNX online shop (the Node.js app in website/).
# In Render: New > Blueprint > pick this repository > fill in ADMIN_PASSWORD > Apply.
#
# This is a FREE PREVIEW setup. Render's free plan has no persistent disk, so the
# database (orders, products you add) and uploaded photos are wiped whenever the
# service restarts or redeploys, and the site sleeps after 15 idle minutes.
# Before taking real orders, switch to the paid setup: change `plan` to 0.5c-512mb
# and uncomment the `disk` block and the DB_FILE / UPLOAD_DIR variables below.
services:
  - type: web
    name: parasmaninx-shop
    runtime: node
    rootDir: website
    region: singapore        # closest Render region to India
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    # disk:
    #   name: shop-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # - key: DB_FILE
      #   value: /var/data/shop.db
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # Render asks for this when you create the service
      - key: SHOP_PHONE
        value: "+91 99694 95026"
      - key: SHOP_WHATSAPP
        value: "919969495026"
      - key: SHOP_EMAIL
        value: hello@parasmaninx.in
      - key: SHOP_ADDRESS
        value: Lakshminarayan Temple Wadi, Mahatma Gandhi Rd, opposite Gandhi Market, Mumbai, Maharashtra 400077
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # New-order email alerts (see website/.env.example for setting up Brevo)
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ORDER_ALERT_EMAIL
        sync: false
