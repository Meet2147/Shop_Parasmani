<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <pattern id="pt" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#a8dcc5"/>
      <g transform="translate(20 20)">
        <circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(0)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(72)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(144)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(216)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(288)"/>
        <circle r="4" fill="#f5c542"/></g><g transform="translate(60 60)">
        <circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(0)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(72)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(144)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(216)"/><circle r="6" cx="0" cy="-8" fill="#d9587a" transform="rotate(288)"/>
        <circle r="4" fill="#f5c542"/></g>
      <path d="M40 30 q6 6 0 12 q-6 -6 0 -12z M0 70 q6 -6 12 0 q-6 6 -12 0z" fill="#f5c542" opacity=".7"/></pattern>
    <pattern id="bd" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="#2f7a5e"/>
    <path d="M0 15 L15 3 L30 15 L15 27 Z" fill="#d6a534"/><circle cx="15" cy="15" r="4" fill="#2f7a5e"/>
    <rect width="30" height="3" fill="#d6a534"/><rect y="27" width="30" height="3" fill="#d6a534"/></pattern>
    <linearGradient id="fold" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".3" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".1"/><stop offset=".8" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <radialGradient id="back" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f0e2cc"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a2a12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="600" height="750" fill="url(#back)"/>
  <g filter="url(#sh)">
    <g transform="rotate(-4 300 420)"><rect x="110" y="420" width="380" height="200" rx="10" fill="#8ecfb3"/>
      <rect x="110" y="420" width="380" height="200" rx="10" fill="url(#fold)"/></g>
    <g transform="rotate(3 300 330)"><rect x="95" y="210" width="410" height="250" rx="10" fill="url(#pt)"/>
      <rect x="95" y="210" width="410" height="250" rx="10" fill="url(#fold)"/></g>
    <g transform="rotate(-2 300 520)"><rect x="140" y="470" width="330" height="170" rx="10" fill="#e8f5ef"/>
      <rect x="140" y="610" width="330" height="30" fill="url(#bd)"/><rect x="140" y="470" width="330" height="170" rx="10" fill="url(#fold)"/></g></g>
