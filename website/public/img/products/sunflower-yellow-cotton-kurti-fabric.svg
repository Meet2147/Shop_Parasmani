<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <pattern id="pt" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#f7c948"/>
      <g transform="translate(20 20)">
        <circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(0)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(72)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(144)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(216)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(288)"/>
        <circle r="4" fill="#e0662f"/></g><g transform="translate(60 60)">
        <circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(0)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(72)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(144)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(216)"/><circle r="6" cx="0" cy="-8" fill="#ffffff" transform="rotate(288)"/>
        <circle r="4" fill="#e0662f"/></g>
      <path d="M40 30 q6 6 0 12 q-6 -6 0 -12z M0 70 q6 -6 12 0 q-6 6 -12 0z" fill="#e0662f" opacity=".7"/></pattern>
    <pattern id="bd" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="#8a4b12"/>
    <path d="M0 15 L15 3 L30 15 L15 27 Z" fill="#d6a534"/><circle cx="15" cy="15" r="4" fill="#8a4b12"/>
    <rect width="30" height="3" fill="#d6a534"/><rect y="27" width="30" height="3" fill="#d6a534"/></pattern>
    <linearGradient id="fold" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".3" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".1"/><stop offset=".8" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <radialGradient id="back" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f0e2cc"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a2a12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="600" height="750" fill="url(#back)"/>
  <g filter="url(#sh)">
    <g transform="rotate(-3 300 420)"><rect x="120" y="390" width="360" height="220" rx="12" fill="url(#pt)"/>
      <rect x="120" y="390" width="360" height="220" rx="12" fill="#00000025"/></g>
    <g transform="rotate(2 300 330)"><rect x="100" y="170" width="400" height="330" rx="12" fill="url(#pt)"/>
      <rect x="100" y="170" width="400" height="330" rx="12" fill="url(#fold)"/>
      <path d="M100 470 L500 470" stroke="#ffffff55" stroke-width="3"/></g></g>
</svg>