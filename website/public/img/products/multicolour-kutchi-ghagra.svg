<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750">
  <defs>
    <pattern id="pt" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#f2c14e"/>
      <g transform="translate(30 30)" fill="#c2185b">
        <ellipse rx="4.5" ry="10" transform="rotate(0) translate(0 -10)"/><ellipse rx="4.5" ry="10" transform="rotate(60) translate(0 -10)"/><ellipse rx="4.5" ry="10" transform="rotate(120) translate(0 -10)"/><ellipse rx="4.5" ry="10" transform="rotate(180) translate(0 -10)"/><ellipse rx="4.5" ry="10" transform="rotate(240) translate(0 -10)"/><ellipse rx="4.5" ry="10" transform="rotate(300) translate(0 -10)"/>
        <circle r="4" fill="#1e6fa8"/></g>
      <circle cx="0" cy="0" r="2.5" fill="#1e6fa8"/><circle cx="60" cy="0" r="2.5" fill="#1e6fa8"/>
      <circle cx="0" cy="60" r="2.5" fill="#1e6fa8"/><circle cx="60" cy="60" r="2.5" fill="#1e6fa8"/></pattern>
    <pattern id="bd" width="30" height="30" patternUnits="userSpaceOnUse">
    <rect width="30" height="30" fill="#6d1b3b"/>
    <path d="M0 15 L15 3 L30 15 L15 27 Z" fill="#d6a534"/><circle cx="15" cy="15" r="4" fill="#6d1b3b"/>
    <rect width="30" height="3" fill="#d6a534"/><rect y="27" width="30" height="3" fill="#d6a534"/></pattern>
    <linearGradient id="fold" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".3" stop-color="#fff" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#000" stop-opacity=".1"/><stop offset=".8" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#000" stop-opacity=".2"/></linearGradient>
    <radialGradient id="back" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fffaf1"/><stop offset="1" stop-color="#f0e2cc"/></radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#5a2a12" flood-opacity=".22"/></filter>
  </defs>
  <rect width="600" height="750" fill="url(#back)"/>
  <g filter="url(#sh)">
    <path d="M225 150 L375 150 L530 640 Q300 700 70 640 Z" fill="url(#pt)"/>
    <path d="M225 150 L375 150 L530 640 Q300 700 70 640 Z" fill="url(#fold)"/>
    <path d="M86 600 Q300 660 514 600 L530 640 Q300 700 70 640 Z" fill="url(#bd)"/>
    <rect x="215" y="128" width="170" height="30" rx="6" fill="url(#bd)"/>
    <path d="M300 158 L300 250" stroke="#00000022" stroke-width="3"/></g>
</svg>